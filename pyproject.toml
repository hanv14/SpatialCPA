[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "spatialcpav25-gen"
version = "0.1.0"
description = "SpatialCPA-v25-Gen: a continuous 3D transcriptomic field for generating virtual tissue sections, with sectioning-equivariant field learning (SEFL)."
readme = "CLAUDE.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "SpatialCPA authors" }]
keywords = ["spatial-transcriptomics", "neural-field", "flow-matching", "in-silico-sectioning"]

# Pinned exactly: this is research code whose numbers go in a paper, and a silent
# dependency bump that shifts a metric by 0.01 is not a debuggable event.
dependencies = [
  "numpy==1.26.4",
  "scipy==1.11.4",
  "pandas==2.1.4",
  "scikit-learn==1.3.2",
  "torch==2.2.2",
  "anndata==0.10.7",
  "scanpy==1.10.1",
  "h5py==3.10.0",
  "pyarrow==15.0.2",
  "PyYAML==6.0.1",
  "tqdm==4.66.4",
  "matplotlib==3.8.4",
  "statsmodels==0.14.1",
  "igraph==0.11.4",
  "leidenalg==0.10.2",
  "transformers==4.40.2",
  "tokenizers==0.19.1",
  "safetensors==0.4.3",
]

[project.optional-dependencies]
# T08 prefers geomloss for the Sinkhorn divergence and falls back to multi-bandwidth
# RBF MMD when it is absent; T02 uses mygene only when building the gene-meta table,
# never at train or test time.
extra = [
  "geomloss==0.2.6",
  "pykeops==2.2.3",
  "mygene==3.2.2",
]
dev = [
  "pytest==8.2.0",
  "pytest-xdist==3.6.1",
  "ruff==0.4.4",
  "mypy==1.10.0",
  "types-PyYAML==6.0.12.20240311",
  "types-tqdm==4.66.0.20240417",
  "pandas-stubs==2.1.4.231227",
]

[project.scripts]
spatialcpav25-gen = "spatialcpav25_gen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["spatialcpav25_gen"]

[tool.hatch.build.targets.sdist]
include = ["spatialcpav25_gen", "tests", "specs", "design", "pyproject.toml", "Makefile"]

# --------------------------------------------------------------------------------------
# ruff
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["spatialcpav25_gen", "tests"]
# Legacy versions live beside the new package at repo root. Exclude them by exact name —
# a glob like "spatialcpav*" would also swallow spatialcpav25_gen, which is the package
# we are actually linting.
extend-exclude = [
  "reference",
  "benchmark-pbya",
  "benchmark-pbya-v2",
  "benchmark-pbya-v3",
  "SpatialZ",
  "data",
  "spatialcpa",
  "spatialcpav4",
  "spatialcpav5",
  "spatialcpav6",
  "spatialcpav8",
  "spatialcpav9",
  "spatialcpav10",
  "spatialcpav11",
  "spatialcpav12",
  "spatialcpav13",
  "spatialcpav14",
  "spatialcpav15",
  "spatialcpav16",
  "spatialcpav17",
  "learn_spatialcpav*.py",
  "run_*.py",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "SIM",  # simplify
  "C4",   # comprehensions
  "RUF",
  "D",    # pydocstyle — convention 2 requires documented tensor shapes
  "ANN",  # annotations — convention 8
  "NPY",  # numpy legacy random / API
  "PT",   # pytest style
]
ignore = [
  "D105",    # magic method docstrings
  "D107",    # __init__ docstring (documented on the class)
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
  "ANN401",  # allow Any where a library forces it
  "ANN101",  # annotating `self` is not a thing anyone does (deprecated upstream)
  "ANN102",  # ditto `cls`
  "E731",
  "N803",    # (N, G)-style maths names: X, W, A are the paper's names
  "N806",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PT011"]
"scripts/**" = ["D", "ANN"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

# --------------------------------------------------------------------------------------
# mypy — strict on the package, relaxed on tests/scripts
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["spatialcpav25_gen"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
plugins = []
# Regex, not globs: the negative lookahead keeps the legacy spatialcpa*/ trees out
# without excluding spatialcpav25_gen itself.
exclude = [
  "^reference/",
  "^benchmark-pbya",
  "^SpatialZ/",
  "^spatialcpa(?!v25_gen)",
  "^learn_spatialcpav",
  "^run_",
]

# Third-party scientific packages ship no (or partial) stubs. Silence the import
# errors only — everything inside spatialcpav25_gen stays strictly typed.
[[tool.mypy.overrides]]
module = [
  "anndata.*",
  "scanpy.*",
  "scipy.*",
  "sklearn.*",
  "statsmodels.*",
  "matplotlib.*",
  "igraph.*",
  "leidenalg.*",
  "geomloss.*",
  "mygene.*",
  "transformers.*",
  "h5py.*",
  "pyarrow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

# --------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --durations=10"
markers = [
  "slow: takes more than a couple of seconds (training loops, gate reports, benchmarks). `make test` excludes these; `pytest tests/ -m 'not slow'` must stay under 3 minutes on CPU.",
  "gate: reproduces a GATE 1 / GATE 2 acceptance criterion (always also `slow`).",
  "network: needs outbound network. Skipped by default; nothing in the default suite may require it.",
]
filterwarnings = [
  "error::RuntimeWarning",
  "ignore::DeprecationWarning",
]
xfail_strict = true
