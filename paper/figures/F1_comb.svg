<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 423" width="760" height="423" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1b1f"><title>F1 the comb limit</title><rect width="760" height="423" fill="#ffffff"/><text x="56.0" y="26.0" font-size="14" text-anchor="start" fill="#1b1b1f" font-weight="bold" font-style="normal">F1  An oblique ground truth is a comb, not a section</text><text x="56.0" y="44.0" font-size="11" text-anchor="start" fill="#6b6f76" font-weight="normal" font-style="normal">Each panel: the cells a tilted plane passes near, in the plane's own frame. Measured geometry, drawn to scale.</text><rect x="56.0" y="76.0" width="190.0" height="250.0" fill="#fbfcfd" stroke="#d8dade" stroke-width="1" opacity="1.0"/><rect x="56.0" y="76.0" width="27.3" height="250.0" fill="#2b6cb0" stroke="none" stroke-width="1" opacity="0.55"/><rect x="119.3" y="76.0" width="27.3" height="250.0" fill="#2b6cb0" stroke="none" stroke-width="1" opacity="0.55"/><rect x="182.7" y="76.0" width="27.3" height="250.0" fill="#2b6cb0" stroke="none" stroke-width="1" opacity="0.55"/><text x="151.0" y="66.0" font-size="12" text-anchor="middle" fill="#1b1b1f" font-weight="bold" font-style="normal">θ = 30°</text><text x="151.0" y="344.0" font-size="11" text-anchor="middle" fill="#1b1b1f" font-weight="normal" font-style="normal">fill 0.43</text><text x="151.0" y="359.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">gap 65 µm</text><rect x="272.0" y="76.0" width="190.0" height="250.0" fill="#fbfcfd" stroke="#d8dade" stroke-width="1" opacity="1.0"/><rect x="272.0" y="76.0" width="22.3" height="250.0" fill="#2b6cb0" stroke="none" stroke-width="1" opacity="0.55"/><rect x="335.3" y="76.0" width="22.3" height="250.0" fill="#2b6cb0" stroke="none" stroke-width="1" opacity="0.55"/><rect x="398.7" y="76.0" width="22.3" height="250.0" fill="#2b6cb0" stroke="none" stroke-width="1" opacity="0.55"/><text x="367.0" y="66.0" font-size="12" text-anchor="middle" fill="#1b1b1f" font-weight="bold" font-style="normal">θ = 45°</text><text x="367.0" y="344.0" font-size="11" text-anchor="middle" fill="#1b1b1f" font-weight="normal" font-style="normal">fill 0.35</text><text x="367.0" y="359.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">gap 53 µm</text><rect x="488.0" y="76.0" width="190.0" height="250.0" fill="#fbfcfd" stroke="#d8dade" stroke-width="1" opacity="1.0"/><rect x="488.0" y="76.0" width="15.8" height="250.0" fill="#2b6cb0" stroke="none" stroke-width="1" opacity="0.55"/><rect x="551.3" y="76.0" width="15.8" height="250.0" fill="#2b6cb0" stroke="none" stroke-width="1" opacity="0.55"/><rect x="614.7" y="76.0" width="15.8" height="250.0" fill="#2b6cb0" stroke="none" stroke-width="1" opacity="0.55"/><text x="583.0" y="66.0" font-size="12" text-anchor="middle" fill="#1b1b1f" font-weight="bold" font-style="normal">θ = 60°</text><text x="583.0" y="344.0" font-size="11" text-anchor="middle" fill="#1b1b1f" font-weight="normal" font-style="normal">fill 0.25</text><text x="583.0" y="359.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">gap 50 µm</text><text x="56.0" y="362.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">fill = t·cos θ / s — strata are t·cos θ / sin θ wide and s / sin θ apart (s = 57.5 µm here). At 90° the fill is</text><text x="56.0" y="377.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">exactly 0: the plane's second in-plane coordinate is −z, which takes one value per section, so the ground truth</text><text x="56.0" y="392.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">is N parallel lines with zero area — whatever generated it. This bounds any method, not ours.</text></svg>