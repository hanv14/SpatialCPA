le="normal">statistic can DISTINGUISH is a constant fraction of the tissue radius — the same on any dataset, at any</text><text x="56.0" y="396.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">magnification, roughly three to four resolvable locations along a radius. The flat line is the surprising half.</text></svg>