<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 435" width="760" height="435" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1b1f"><title>F6 the result</title><rect width="760" height="435" fill="#ffffff"/><text x="62.0" y="26.0" font-size="14" text-anchor="start" fill="#1b1b1f" font-weight="bold" font-style="normal">F6  Not one readable difference reaches a single standard error</text><rect x="158.0" y="92.0" width="452.0" height="210.0" fill="none" stroke="#d8dade" stroke-width="1" opacity="1.0"/><line x1="384.0" y1="92.0" x2="384.0" y2="302.0" stroke="#6b6f76" stroke-width="1.2"/><text x="384.0" y="84.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">0</text><line x1="209.9" y1="92.0" x2="209.9" y2="302.0" stroke="#d8dade" stroke-width="1" stroke-dasharray="3 3"/><text x="209.9" y="318.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">-0.6</text><line x1="296.9" y1="92.0" x2="296.9" y2="302.0" stroke="#d8dade" stroke-width="1" stroke-dasharray="3 3"/><text x="296.9" y="318.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">-0.3</text><line x1="471.1" y1="92.0" x2="471.1" y2="302.0" stroke="#d8dade" stroke-width="1" stroke-dasharray="3 3"/><text x="471.1" y="318.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">+0.3</text><line x1="558.1" y1="92.0" x2="558.1" y2="302.0" stroke="#d8dade" stroke-width="1" stroke-dasharray="3 3"/><text x="558.1" y="318.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">+0.6</text><line x1="262.6" y1="122.0" x2="436.7" y2="122.0" stroke="#1b1b1f" stroke-width="2"/><line x1="262.6" y1="116.0" x2="262.6" y2="128.0" stroke="#1b1b1f" stroke-width="2"/><line x1="436.7" y1="116.0" x2="436.7" y2="128.0" stroke="#1b1b1f" stroke-width="2"/><circle cx="349.7" cy="122.0" r="5" fill="#2f855a" opacity="1.0"/><text x="62.0" y="127.0" font-size="13" text-anchor="start" fill="#1b1b1f" font-weight="bold" font-style="normal">30°</text><text x="96.0" y="127.0" font-size="10" text-anchor="start" fill="#b00020" font-weight="normal" font-style="normal"></text><text x="622.0" y="120.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">-0.1183 ± 0.2999</text><text x="622.0" y="136.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="bold" font-style="normal">0.39σ</text><line x1="199.9" y1="184.0" x2="442.0" y2="184.0" stroke="#1b1b1f" stroke-width="2"/><line x1="199.9" y1="178.0" x2="199.9" y2="190.0" stroke="#1b1b1f" stroke-width="2"/><line x1="442.0" y1="178.0" x2="442.0" y2="190.0" stroke="#1b1b1f" stroke-width="2"/><circle cx="320.9" cy="184.0" r="5" fill="#2f855a" opacity="1.0"/><text x="62.0" y="189.0" font-size="13" text-anchor="start" fill="#1b1b1f" font-weight="bold" font-style="normal">45°</text><text x="96.0" y="189.0" font-size="10" text-anchor="start" fill="#b00020" font-weight="normal" font-style="normal"></text><text x="622.0" y="182.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">-0.2173 ± 0.4171</text><text x="622.0" y="198.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="bold" font-style="normal">0.52σ</text><line x1="182.2" y1="246.0" x2="559.0" y2="246.0" stroke="#6b6f76" stroke-width="2"/><line x1="182.2" y1="240.0" x2="182.2" y2="252.0" stroke="#6b6f76" stroke-width="2"/><line x1="559.0" y1="240.0" x2="559.0" y2="252.0" stroke="#6b6f76" stroke-width="2"/><circle cx="370.6" cy="246.0" r="5" fill="#6b6f76" opacity="1.0"/><text x="62.0" y="251.0" font-size="13" text-anchor="start" fill="#6b6f76" font-weight="bold" font-style="normal">60°</text><text x="96.0" y="251.0" font-size="10" text-anchor="start" fill="#b00020" font-weight="normal" font-style="normal">— not readable</text><text x="622.0" y="244.0" font-size="11" text-anchor="start" fill="#6b6f76" font-weight="normal" font-style="normal">-0.0462 ± 0.6492</text><text x="622.0" y="260.0" font-size="11" text-anchor="start" fill="#6b6f76" font-weight="bold" font-style="normal">0.07σ</text><text x="62.0" y="267.0" font-size="9" text-anchor="start" fill="#b00020" font-weight="normal" font-style="normal">P2 fails</text><text x="62.0" y="344.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">The bars are a leave-one-scorable-type-out jackknife combined in quadrature. They are an UPPER BOUND ON</text><text x="62.0" y="359.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">PRECISION, not confidence intervals, and they are not narrowed (§5.4): with 6-9 scorable types, leaving one out</text><text x="62.0" y="374.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">removes 11-17% of the data and re-normalises the metric's own radius, scale and null draws. Every interval</text><text x="62.0" y="389.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">spans zero. 60° is shown rather than omitted because its null control fails P2 - the protocol disqualified it,</text><text x="62.0" y="404.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">and showing a disqualified angle greyed is what that looks like.</text></svg>