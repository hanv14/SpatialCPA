<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" width="760" height="436" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1b1b1f"><title>F5 the scrambled-section floor</title><rect width="760" height="436" fill="#ffffff"/><text x="62.0" y="26.0" font-size="14" text-anchor="start" fill="#1b1b1f" font-weight="bold" font-style="normal">F5  A section with randomised cell types scores 0.03-0.24, and does not fall with n</text><text x="62.0" y="44.0" font-size="11" text-anchor="start" fill="#6b6f76" font-weight="normal" font-style="normal">Left: the ground truth's own cell types permuted among its own cells, scored against itself. No method, no donor, no arm.</text><rect x="62.0" y="212.4" width="636.0" height="92.4" fill="#9a6fb0" stroke="none" stroke-width="1" opacity="0.14"/><rect x="62.0" y="92.0" width="372.0" height="228.0" fill="none" stroke="#d8dade" stroke-width="1" opacity="1.0"/><text x="62.0" y="80.0" font-size="12" text-anchor="start" fill="#1b1b1f" font-weight="bold" font-style="normal">A   scrambled-section floor vs cell count</text><line x1="62.0" y1="320.0" x2="698.0" y2="320.0" stroke="#d8dade" stroke-width="1"/><text x="54.0" y="324.0" font-size="10" text-anchor="end" fill="#6b6f76" font-weight="normal" font-style="normal">0.0</text><line x1="62.0" y1="274.4" x2="698.0" y2="274.4" stroke="#d8dade" stroke-width="1"/><text x="54.0" y="278.4" font-size="10" text-anchor="end" fill="#6b6f76" font-weight="normal" font-style="normal">0.1</text><line x1="62.0" y1="228.8" x2="698.0" y2="228.8" stroke="#d8dade" stroke-width="1"/><text x="54.0" y="232.8" font-size="10" text-anchor="end" fill="#6b6f76" font-weight="normal" font-style="normal">0.2</text><line x1="62.0" y1="183.2" x2="698.0" y2="183.2" stroke="#d8dade" stroke-width="1"/><text x="54.0" y="187.2" font-size="10" text-anchor="end" fill="#6b6f76" font-weight="normal" font-style="normal">0.3</text><line x1="62.0" y1="137.6" x2="698.0" y2="137.6" stroke="#d8dade" stroke-width="1"/><text x="54.0" y="141.6" font-size="10" text-anchor="end" fill="#6b6f76" font-weight="normal" font-style="normal">0.4</text><line x1="62.0" y1="92.0" x2="698.0" y2="92.0" stroke="#d8dade" stroke-width="1"/><text x="54.0" y="96.0" font-size="10" text-anchor="end" fill="#6b6f76" font-weight="normal" font-style="normal">0.5</text><polyline points="93.0,275.3 155.0,212.4 217.0,271.2 403.0,241.8" fill="none" stroke="#9a6fb0" stroke-width="1.4" opacity="0.85"/><line x1="93.0" y1="285.7" x2="93.0" y2="264.9" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="93.0" cy="275.3" r="3.4" fill="#9a6fb0" opacity="1.0"/><line x1="155.0" y1="238.0" x2="155.0" y2="186.7" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="155.0" cy="212.4" r="3.4" fill="#9a6fb0" opacity="1.0"/><line x1="217.0" y1="285.3" x2="217.0" y2="257.1" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="217.0" cy="271.2" r="3.4" fill="#9a6fb0" opacity="1.0"/><line x1="403.0" y1="267.6" x2="403.0" y2="216.1" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="403.0" cy="241.8" r="3.4" fill="#9a6fb0" opacity="1.0"/><text x="411.0" y="245.8" font-size="10" text-anchor="start" fill="#9a6fb0" font-weight="normal" font-style="normal">30°</text><polyline points="93.0,295.7 155.0,282.5 217.0,279.1 341.0,304.8" fill="none" stroke="#9a6fb0" stroke-width="1.4" opacity="0.85"/><line x1="93.0" y1="317.4" x2="93.0" y2="274.1" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="93.0" cy="295.7" r="3.4" fill="#9a6fb0" opacity="1.0"/><line x1="155.0" y1="299.8" x2="155.0" y2="265.2" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="155.0" cy="282.5" r="3.4" fill="#9a6fb0" opacity="1.0"/><line x1="217.0" y1="290.4" x2="217.0" y2="267.8" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="217.0" cy="279.1" r="3.4" fill="#9a6fb0" opacity="1.0"/><line x1="341.0" y1="319.0" x2="341.0" y2="290.6" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="341.0" cy="304.8" r="3.4" fill="#9a6fb0" opacity="1.0"/><text x="349.0" y="308.8" font-size="10" text-anchor="start" fill="#9a6fb0" font-weight="normal" font-style="normal">45°</text><polyline points="93.0,281.3 155.0,304.6 217.0,279.4 279.0,260.5" fill="none" stroke="#9a6fb0" stroke-width="1.4" opacity="0.85"/><line x1="93.0" y1="295.8" x2="93.0" y2="266.7" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="93.0" cy="281.3" r="3.4" fill="#9a6fb0" opacity="1.0"/><line x1="155.0" y1="330.6" x2="155.0" y2="278.5" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="155.0" cy="304.6" r="3.4" fill="#9a6fb0" opacity="1.0"/><line x1="217.0" y1="302.0" x2="217.0" y2="256.7" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="217.0" cy="279.4" r="3.4" fill="#9a6fb0" opacity="1.0"/><line x1="279.0" y1="273.6" x2="279.0" y2="247.4" stroke="#9a6fb0" stroke-width="1.2"/><circle cx="279.0" cy="260.5" r="3.4" fill="#9a6fb0" opacity="1.0"/><text x="287.0" y="264.5" font-size="10" text-anchor="start" fill="#9a6fb0" font-weight="normal" font-style="normal">60°</text><text x="93.0" y="336.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">250</text><text x="155.0" y="336.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">500</text><text x="217.0" y="336.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">1000</text><text x="279.0" y="336.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">1011</text><text x="341.0" y="336.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">1311</text><text x="403.0" y="336.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">1906</text><text x="248.0" y="354.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">cells in the scored section (n)</text><text x="428.0" y="204.4" font-size="10" text-anchor="end" fill="#9a6fb0" font-weight="bold" font-style="normal">band 0.03-0.24</text><rect x="506.0" y="92.0" width="192.0" height="228.0" fill="none" stroke="#d8dade" stroke-width="1" opacity="1.0"/><text x="506.0" y="80.0" font-size="12" text-anchor="start" fill="#1b1b1f" font-weight="bold" font-style="normal">B   the arms, same axis</text><line x1="538.0" y1="206.7" x2="538.0" y2="260.7" stroke="#6b6f76" stroke-width="1"/><circle cx="538.0" cy="206.7" r="4.2" fill="#c05621" opacity="1.0"/><circle cx="538.0" cy="260.7" r="4.2" fill="#2f855a" opacity="1.0"/><text x="538.0" y="197.7" font-size="9" text-anchor="middle" fill="#1b1b1f" font-weight="normal" font-style="normal">0.118</text><text x="538.0" y="336.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">30°</text><line x1="602.0" y1="167.7" x2="602.0" y2="266.8" stroke="#6b6f76" stroke-width="1"/><circle cx="602.0" cy="167.7" r="4.2" fill="#c05621" opacity="1.0"/><circle cx="602.0" cy="266.8" r="4.2" fill="#2f855a" opacity="1.0"/><text x="602.0" y="158.7" font-size="9" text-anchor="middle" fill="#1b1b1f" font-weight="normal" font-style="normal">0.217</text><text x="602.0" y="336.0" font-size="10" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="normal">45°</text><line x1="666.0" y1="114.1" x2="666.0" y2="135.2" stroke="#6b6f76" stroke-width="1"/><circle cx="666.0" cy="114.1" r="4.2" fill="#c05621" opacity="1.0"/><circle cx="666.0" cy="135.2" r="4.2" fill="#2f855a" opacity="1.0"/><text x="666.0" y="105.1" font-size="9" text-anchor="middle" fill="#6b6f76" font-weight="normal" font-style="italic">0.046</text><text x="666.0" y="336.0" font-size="10" text-anchor="middle" fill="#b00020" font-weight="normal" font-style="normal">60°</text><text x="666.0" y="350.0" font-size="9" text-anchor="middle" fill="#b00020" font-weight="normal" font-style="normal">P2 fails</text><circle cx="518.0" cy="308.0" r="4.2" fill="#c05621" opacity="1.0"/><text x="528.0" y="312.0" font-size="9" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">baseline</text><circle cx="518.0" cy="322.0" r="4.2" fill="#2f855a" opacity="1.0"/><text x="528.0" y="326.0" font-size="9" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">ours</text><text x="62.0" y="360.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">The floor does not fall with n: (0.171/0.033/0.130) at each angle's largest n, against (0.098/0.053/0.085) at n</text><text x="62.0" y="375.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">= 250 — higher at two of the three, and nowhere near zero. The arm-to-arm differences in B span 0.046 to 0.217;</text><text x="62.0" y="390.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">the band they are read against itself spans 0.203. Our arm's scores at 30° and 45° fall inside that band; the</text><text x="62.0" y="405.0" font-size="11" text-anchor="start" fill="#1b1b1f" font-weight="normal" font-style="normal">baseline's do not. 60° is greyed: its null control fails P2.</text></svg>